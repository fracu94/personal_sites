
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080d18" />
  <meta name="description" content="Francesco Custureri | AI Lead. Sito in costruzione." />
  <title>Francesco Custureri | AI Lead</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #080d18;
      color: #f5f8ff;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 40%,
          rgba(32, 126, 255, 0.13),
          transparent 50%
        ),
        linear-gradient(
          rgba(75, 130, 190, 0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(75, 130, 190, 0.035) 1px,
          transparent 1px
        );
      background-size: auto, 50px 50px, 50px 50px;
    }

    main {
      position: relative;
      z-index: 1;
      padding: 32px;
      text-align: center;
      animation: appear 1.4s ease both;
    }

    .logo {
      width: 130px;
      height: 130px;
      margin: 0 auto 32px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 28px;
      background: rgba(56, 189, 248, 0.04);
      box-shadow: 0 0 70px rgba(0, 153, 255, 0.09);
    }

    .logo svg {
      width: 85px;
      height: 85px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      font-weight: 750;
      letter-spacing: -0.055em;
      line-height: 1.1;
    }

    .role {
      margin: 18px 0 42px;
      color: #38bdf8;
      font-size: 0.9rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    .divider {
      width: 65px;
      height: 1px;
      margin: 0 auto 32px;
      background: #38bdf8;
    }

    .status {
      color: #b9c8db;
      font-size: 0.85rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .footer {
      position: fixed;
      bottom: 26px;
      left: 0;
      right: 0;
      color: #64748b;
      font-size: 0.75rem;
      text-align: center;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>

<body>
  <main>
    <div class="logo">
      <!-- Monogramma FC provvisorio -->
      <svg viewBox="0 0 100 100" aria-label="FC">
        <defs>
          <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0b68ff"/>
            <stop offset="100%" stop-color="#67e8f9"/>
          </linearGradient>
        </defs>
        <path
          d="M19 23 H65 M19 23 V77 M19 46 H53"
          fill="none"
          stroke="url(#blue)"
          stroke-width="7"
          stroke-linecap="round"
        />
        <path
          d="M82 31 A30 30 0 1 0 82 69"
          fill="none"
          stroke="url(#blue)"
          stroke-width="7"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <h1>Francesco Custureri</h1>
    <p class="role">AI Lead</p>

    <div class="divider"></div>
    <p class="status">Sito in costruzione</p>
  </main>

  <footer class="footer">
    © Francesco Custureri
  </footer>
</body>
</html>
